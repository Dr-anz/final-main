name: Test and Publish to Docker Hub


on:
  push:
    branches: [ main ]      # триггер при пуше в ветку main
    tags: [ 'v*.*.*' ]   # триггер при добавлении тегов вида v1.0.0
  pull_request:
    branches: [ main ]      # триггер при PR в ветку main

jobs:
  test-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        run: go build -o app .

  publish-to-dockerhub:
    runs-on: ubuntu-latest
    needs: test-code
    if: contains(github.ref, 'tags')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dranzz:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dranzz:${{ github.ref_name }}
